name: macOS Conda Fix Build

on:
  push:
    branches:
      - fix/macos-conda-path

permissions:
  contents: read

jobs:
  build-universal-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build universal macOS app and DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coding-tools-mcp-macos-conda-fix-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
